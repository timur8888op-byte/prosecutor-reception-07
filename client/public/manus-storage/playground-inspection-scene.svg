 <linearGradient id="ground" x2="0" y2="1"><stop stop-color="#8a8571"/><stop offset="1" stop-color="#343e3c"/></linearGradient>
 <linearGradient id="concrete" x2="0" y2="1"><stop stop-color="#aaa89a"/><stop offset="1" stop-color="#626b68"/></linearGradient>
 <linearGradient id="metal" x2="1" y2="1"><stop stop-color="#415e65"/><stop offset=".5" stop-color="#172a30"/><stop offset="1" stop-color="#6c8585"/></linearGradient>
